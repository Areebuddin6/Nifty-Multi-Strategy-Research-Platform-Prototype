    <script>
      // Suppress benign Vite HMR websocket disconnection unhandled rejections in sandboxed preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason) {
          var msg = event.reason.message || String(event.reason);
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('websocket') || event.message.includes('vite'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
